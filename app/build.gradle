plugins { id 'com.android.application' }

android {
    namespace 'com.studious.spoon'
    compileSdk 35

    defaultConfig {
        applicationId 'com.studious.spoon'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            def signingPropertiesPath = project.findProperty("signingPropertiesPath")
            if (signingPropertiesPath != null) {
                def props = new Properties()
                file(signingPropertiesPath).withInputStream { props.load(it) }
                storeFile file(props.getProperty("storeFile"))
                storePassword props.getProperty("storePassword")
                keyAlias props.getProperty("keyAlias")
                keyPassword props.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
